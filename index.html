<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Class Notes</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top,#1e3c72,#0f0c29);
    color:white;
    text-align:center;
}

/* HEADER */
header{
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

/* TAGLINE */
.tag{
    font-size:14px;
    opacity:0.8;
}

/* SEARCH */
#search{
    width:80%;
    padding:12px;
    border:none;
    border-radius:12px;
    outline:none;
    margin-top:10px;
}

/* GRID */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:30px;
}

/* CARDS */
.card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(12px);
    color:white;
    width:180px;
    margin:15px;
    padding:20px;
    border-radius:18px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.12);
    background:white;
    color:black;
}

/* FLOAT MENU */
.fab{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#ff4757;
    border:none;
    color:white;
    padding:15px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
}

.menu{
    position:fixed;
    bottom:80px;
    right:20px;
    display:none;
    background:white;
    color:black;
    padding:10px;
    border-radius:12px;
}

.menu a{
    display:block;
    padding:8px;
    text-decoration:none;
    color:black;
}

/* BADGE */
.badge{
    position:fixed;
    top:10px;
    right:10px;
    background:rgba(255,255,255,0.15);
    padding:8px 12px;
    border-radius:10px;
    font-size:12px;
    backdrop-filter:blur(10px);
}
</style>

</head>

<body>

<div class="badge">Directed by - MR.SHIVENDRARAJ</div>

<header>🌍 WORLD CLASS NOTES</header>
<div class="tag">Learn Smart • Learn Fast • Learn Anywhere</div>

<input id="search" placeholder="Search Class..." onkeyup="searchFun()">

<div class="container">

<a class="card" href="class8.html">📕 Class 8</a>
<a class="card" href="class9.html">📗 Class 9</a>
<a class="card" href="class10.html">📘 Class 10</a>
<a class="card" href="class11.html">📙 Class 11</a>
<a class="card" href="class12.html">📒 Class 12</a>

</div>

<button class="fab" onclick="toggleMenu()">☰</button>

<div class="menu" id="menu">
<a href="class8.html">Class 8</a>
<a href="class9.html">Class 9</a>
<a href="class10.html">Class 10</a>
<a href="class11.html">Class 11</a>
<a href="class12.html">Class 12</a>
</div>

<script>
function searchFun(){
    let input=document.getElementById("search").value.toLowerCase();
    let cards=document.getElementsByClassName("card");

    for(let i=0;i<cards.length;i++){
        let text=cards[i].innerText.toLowerCase();
        cards[i].style.display=text.includes(input)?"":"none";
    }
}

function toggleMenu(){
    let m=document.getElementById("menu");
    m.style.display = (m.style.display==="block")?"none":"block";
}
</script>

</body>
</html>
